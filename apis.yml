name: Collabra
description: 'Collabra (Collabra Pty Ltd, ABN 35 672 933 818) is an Australian enterprise
  AI automation company whose platform combines robotic process automation with large
  language models to run back-office operations — contract review, revenue assurance,
  financial operations, vendor management, data processing, and compliance monitoring.
  Its product suite is CollabraCore (isolated, segmented data-protection workspaces),
  CollabraGuard (an AI-safety layer that constrains LLM output to prevent hallucinations
  and errors while logging every action), and CollabraFlow (a rapid build-test-deploy
  environment for automation workflows). The public tagline is "AI you can trust to
  run your operations". As of this profile Collabra is a demo-led SaaS with no public
  developer API, SDK, or documentation surface.'
